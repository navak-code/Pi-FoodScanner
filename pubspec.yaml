name: Food Protocol
description: Production Edge AI Dietary & Environmental Guardian Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

# Root-level dependencies block
dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  nsd: ^5.0.1
  http: ^1.2.1
  geolocator: ^11.0.0
  workmanager: ^0.5.2
  flutter_local_notifications: ^17.1.2

# Root-level dev_dependencies block for build tools
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

# Root-level flutter configuration block
flutter:
  uses-material-design: true
dependencies:
  web_socket_channel: ^3.0.0
